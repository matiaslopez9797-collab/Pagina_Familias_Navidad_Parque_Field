<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración · Navidad Parque Field</title>
  <style>
    :root{--navy:#123b52;--red:#d84a43;--green:#28735d;--cream:#fffaf0;--ink:#173643;--muted:#64777d;--line:#dce7e3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px Arial,sans-serif}button,input{font:inherit}.hidden{display:none!important}.top{height:76px;padding:0 5vw;display:flex;align-items:center;gap:14px;background:white;border-bottom:1px solid var(--line)}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:white;font-weight:900}.brand{font-weight:900;text-transform:uppercase;font-size:12px;line-height:1.1}.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}.shell{max-width:1150px;margin:auto;padding:48px 24px}.login{max-width:430px;margin:7vh auto;background:white;padding:34px;border-radius:26px;box-shadow:0 18px 55px #153b4720}.login h1,.heading h1{font:normal 38px Georgia,serif;color:var(--navy);margin:0 0 10px}.login p,.heading p{color:var(--muted);line-height:1.55}.field{display:block;margin:20px 0}.field span{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #cbdad5;border-radius:12px;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #28735d18}.btn{border:0;border-radius:24px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:white;width:100%}.ghost{background:#edf3f1;color:var(--navy)}.btn:disabled{opacity:.5;cursor:not-allowed}.error{display:none;background:#fff0ee;color:#a6312d;padding:11px 13px;border-radius:11px;margin:14px 0;line-height:1.45}.error.show{display:block}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.summary{display:flex;gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:13px 17px;min-width:120px}.stat b{display:block;font-size:25px;color:var(--navy)}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #153b4712}.photo{aspect-ratio:4/3;background:#eaf1ef;display:grid;place-items:center;color:var(--muted);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:17px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px}.body h3{margin:11px 0 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.approve{background:var(--green);color:white}.reject{background:#fff0ee;color:#a6312d}.notice{grid-column:1/-1;font-size:10px;color:var(--muted);text-align:center}.empty{text-align:center;background:white;border:1px dashed #bdd0ca;border-radius:22px;padding:60px 20px;color:var(--muted)}.empty b{display:block;color:var(--navy);font:normal 25px Georgia,serif;margin-bottom:8px}.loading{text-align:center;padding:50px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.shell{padding:30px 15px}.heading{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.top #adminEmail{display:none}.summary{width:100%}.stat{flex:1}}
  </style>
</head>
<body>
  <header class="top"><span class="mark">NPF</span><span class="brand">Navidad Parque Field<br>Administración</span><div class="right"><span id="adminEmail"></span><button id="logout" class="btn ghost hidden">Cerrar sesión</button></div></header>
  <main class="shell">
    <section id="loginView" class="login">
      <h1>Ingresar</h1>
      <p>Acceso exclusivo para administrar las imágenes enviadas por las familias.</p>
      <form id="loginForm">
        <label class="field"><span>Correo administrador</span><input id="email" type="email" value="navidadparquefield@gmail.com" readonly></label>
        <label class="field"><span>Contraseña</span><input id="password" type="password" autocomplete="current-password" required></label>
        <p id="loginError" class="error" role="alert"></p>
        <button id="loginButton" class="btn primary" type="submit">Ingresar</button>
      </form>
    </section>
    <section id="adminView" class="hidden">
      <div class="heading"><div><h1>Imágenes pendientes</h1><p>Revisá cada imagen antes de enviarla a Google Drive.</p></div><div class="summary"><div class="stat"><b id="pendingCount">0</b><span>Pendientes</span></div></div></div>
      <p id="adminError" class="error" role="alert"></p>
      <div id="gallery" class="grid"></div>
    </section>
  </main>
  <script>
    const SUPABASE_URL='https://rlzmyuizjdvbvcyeruyq.supabase.co';
    const SUPABASE_KEY='sb_publishable_F5l_0eQPnfZxUHecqyg2IA_C4HA--QX';
    const BUCKET='npf-files';
    const ADMIN_EMAIL='navidadparquefield@gmail.com';
    let accessToken=localStorage.getItem('npf_admin_token')||'';
    const headers=()=>({apikey:SUPABASE_KEY,Authorization:'Bearer '+accessToken});
    function message(el,text){el.textContent=text;el.classList.toggle('show',!!text)}
    function showLogin(){loginView.classList.remove('hidden');adminView.classList.add('hidden');logout.classList.add('hidden');adminEmail.textContent=''}
    function showAdmin(){loginView.classList.add('hidden');adminView.classList.remove('hidden');logout.classList.remove('hidden');adminEmail.textContent=ADMIN_EMAIL;loadPending()}
    async function verifySession(){if(!accessToken)return showLogin();try{const response=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:headers()});if(!response.ok)throw new Error();const user=await response.json();if(user.email!==ADMIN_EMAIL)throw new Error();showAdmin()}catch{localStorage.removeItem('npf_admin_token');accessToken='';showLogin()}}
    loginForm.onsubmit=async(event)=>{event.preventDefault();message(loginError,'');loginButton.disabled=true;loginButton.textContent='Ingresando…';try{const response=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error_description||data.msg||'Datos incorrectos');if(data.user?.email!==ADMIN_EMAIL)throw new Error('Esta cuenta no tiene permisos de administración.');accessToken=data.access_token;localStorage.setItem('npf_admin_token',accessToken);password.value='';showAdmin()}catch(error){message(loginError,error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':error.message)}finally{loginButton.disabled=false;loginButton.textContent='Ingresar'}};
    logout.onclick=()=>{localStorage.removeItem('npf_admin_token');accessToken='';showLogin()};
    async function signedImage(path){const encoded=path.split('/').map(encodeURIComponent).join('/');const response=await fetch(SUPABASE_URL+'/storage/v1/object/sign/'+BUCKET+'/'+encoded,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({expiresIn:600})});if(!response.ok)throw new Error('No se pudo abrir la imagen');const data=await response.json();return SUPABASE_URL+'/storage/v1'+data.signedURL}
    async function loadPending(){message(adminError,'');gallery.innerHTML='<div class="loading">Cargando imágenes…</div>';try{const response=await fetch(SUPABASE_URL+'/rest/v1/family_uploads?select=*&status=eq.pendiente&order=created_at.desc',{headers:headers()});if(!response.ok)throw new Error('No se pudo consultar la tabla family_uploads.');const rows=await response.json();pendingCount.textContent=rows.length;if(!rows.length){gallery.innerHTML='<div class="empty"><b>No hay imágenes pendientes</b>Las nuevas cargas aparecerán aquí.</div>';return}const cards=await Promise.all(rows.map(async row=>{let url='';try{url=await signedImage(row.storage_path)}catch{}return card(row,url)}));gallery.innerHTML='';cards.forEach(cardElement=>gallery.appendChild(cardElement))}catch(error){gallery.innerHTML='';message(adminError,error.message)}}
    function card(row,url){const article=document.createElement('article');article.className='card';const date=new Date(row.created_at).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'});article.innerHTML='<div class="photo">'+(url?'<img alt="Imagen pendiente">':'No se pudo mostrar la imagen')+'</div><div class="body"><div class="meta"><span>'+date+'</span><span>'+formatBytes(row.size_bytes)+'</span></div><h3></h3><div class="actions"><button class="btn approve" type="button">Aprobar</button><button class="btn reject" type="button">Rechazar</button><span class="notice">La aprobación se habilitará al conectar Google Drive.</span></div></div>';article.querySelector('h3').textContent=row.original_name;if(url)article.querySelector('img').src=url;const approve=article.querySelector('.approve');approve.onclick=()=>alert('Primero conectaremos Google Drive. La imagen sigue segura en Supabase y no será eliminada.');article.querySelector('.reject').onclick=()=>rejectUpload(row,article);return article}
    async function rejectUpload(row,article){if(!confirm('¿Rechazar y eliminar definitivamente esta imagen?'))return;const buttons=article.querySelectorAll('button');buttons.forEach(button=>button.disabled=true);const encoded=row.storage_path.split('/').map(encodeURIComponent).join('/');try{const remove=await fetch(SUPABASE_URL+'/storage/v1/object/'+BUCKET+'/'+encoded,{method:'DELETE',headers:headers()});if(!remove.ok)throw new Error('No se pudo eliminar el archivo.');const update=await fetch(SUPABASE_URL+'/rest/v1/family_uploads?id=eq.'+encodeURIComponent(row.id),{method:'PATCH',headers:{...headers(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:'rechazada'})});if(!update.ok)throw new Error('El archivo se eliminó, pero no se pudo actualizar su estado.');article.remove();const remaining=gallery.querySelectorAll('.card').length;pendingCount.textContent=remaining;if(!remaining)gallery.innerHTML='<div class="empty"><b>No hay imágenes pendientes</b>Las nuevas cargas aparecerán aquí.</div>'}catch(error){message(adminError,error.message);buttons.forEach(button=>button.disabled=false)}}
    function formatBytes(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';return(bytes/1048576).toFixed(1)+' MB'}
    verifySession();
  </script>
</body>
</html>
