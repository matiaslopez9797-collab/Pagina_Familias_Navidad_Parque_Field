const defaults={general:{siteName:'Navidad Parque Field',eyebrow:'Una Navidad hecha entre todos',heroTitle:'La magia vuelve a',heroHighlight:'Parque Field',heroText:'Compartí tus dibujos, cartas y recuerdos. Descubrí las actividades que estamos preparando para toda la familia.',logoUrl:'',bannerUrl:'',eventDate:'2026-12-20T18:00',countTitle:'Nos encontramos el 20 de diciembre',eventPlace:'Plaza del barrio'},history:{intro1:'Navidad Parque Field nace del encuentro de dos herencias: la costumbre familiar de armar pesebres para compartir con la comunidad y el recuerdo vivo de nuestra Nona, Tita Bolognesi.',intro2:'Con su guitarra y su bombo, la Nona recorría el flamante vecindario acompañada por niños y jóvenes, llenando sus calles de villancicos. Años después decidimos recuperar ese espíritu y hacerlo crecer en nuestra esquina de siempre.',phrase:'Para que la gente vuelva a creer en la Navidad.',childrenGoal:'Encender el asombro y la ilusión, regalándoles recuerdos imborrables.',adultGoal:'Romper con la rutina y volver a disfrutar como cuando eran chicos.',fullStory:'En 2014 armamos nuestro primer pesebre familiar en Parque Field.\nCon esa premisa quisimos llevar la tradición navideña a otra escala, sumando luces, color y encuentro comunitario.\nEn 2023 llegó el Buzón de Papá Noel y en 2025 Papá Noel salió a la vereda para encontrarse con las familias.\nLa esquina se transformó en una fiesta comunitaria y recuperamos los villancicos como parte de nuestros festivales.'},events:[{id:1,day:'20',month:'DIC',title:'Navidad Parque Field',time:'18:00',place:'Plaza del barrio',featured:true},{id:2,day:'12',month:'DIC',title:'Taller de adornos',time:'17:30',place:'Espacio comunitario',featured:false},{id:3,day:'16',month:'DIC',title:'Ensayo de villancicos',time:'18:30',place:'Plaza del barrio',featured:false}],songs:[{id:1,title:'Noche de paz',url:''},{id:2,title:'Campana sobre campana',url:''},{id:3,title:'Los peces en el río',url:''}],letters:{title:'Escribile una carta a Santa',text:'Contale qué fue lo más lindo de tu año y qué deseo tenés para tu comunidad.'},upload:{title:'Subí tu creación',text:'Antes de cargar una imagen te vamos a pedir que leas y aceptes el consentimiento informado. Las autorizaciones de publicación se eligen por separado.'},sections:{about:true,countdown:true,songs:true,letters:true,events:true,upload:true},consent:{version:'v1.1',eventName:'Fotos con Papá Noel',eventLocation:'Parque Field',step1Title:'1. ¿Quién aparece en la fotografía?',step1Text:'Indicá si la imagen corresponde a una persona adulta o a una persona menor de edad. Los datos de quien presta el consentimiento se registran para dejar constancia de la autorización.',step2Title:'2. Elegí para qué autorizás el uso',step2Text:'Cada finalidad es independiente. Podés autorizar una, varias o ninguna de las finalidades de difusión.',importantTitle:'Información importante',importantText:'La carga de la imagen no autoriza por sí sola todos los usos. El sistema registra la versión del consentimiento, las finalidades seleccionadas, la identidad declarada, la fecha y hora y datos técnicos necesarios para dejar constancia de la aceptación.',minorTitle:'3. Protección especial si aparece un menor',minorBox:'La persona adulta declara que la autorización responde al interés superior del niño, niña o adolescente y que fue informado/a de acuerdo con su edad y madurez. Si el menor se opone claramente a la publicación o difusión, no se debe autorizar ese uso.',minorBestText:'Declaro que la autorización de uso de la imagen del menor es en su interés superior.',minorInformedText:'Declaro que informé al menor de acuerdo con su edad y madurez y tuve en cuenta su opinión.',finalTitle:'Confirmación final',finalReadText:'Leí y comprendí el consentimiento informado.',finalAuthorityText:'Declaro que los datos proporcionados son verdaderos y que tengo autoridad para prestar este consentimiento.',finalPurposesText:'Entiendo que cada finalidad se autoriza o rechaza de manera individual.',finalTreatmentText:'Acepto que la imagen y los datos asociados sean tratados únicamente conforme a las finalidades seleccionadas.',purposeEvent:{title:'A. Registro y memoria del evento',short:'Conservar la imagen como registro del evento.',detail:'Autoriza conservar y utilizar la imagen para documentar la actividad, generar memoria del evento y mantener un registro interno o histórico de lo realizado. Esta finalidad no autoriza por sí misma difusión digital, institucional ni promocional.'},purposeDigital:{title:'B. Difusión digital',short:'Web, redes sociales y otros canales digitales del organizador.',detail:'Autoriza la publicación de la imagen en el sitio web, redes sociales y otros canales digitales administrados por la organización, dentro de los contenidos vinculados con Navidad Parque Field. No comprende usos promocionales distintos de los seleccionados.'},purposeInstitutional:{title:'C. Difusión institucional',short:'Materiales institucionales vinculados con la iniciativa.',detail:'Autoriza el uso de la imagen en presentaciones, comunicaciones, memorias, piezas institucionales o materiales vinculados con la actividad y su finalidad comunitaria. No implica autorización para publicidad comercial de terceros.'},purposePromotional:{title:'D. Difusión promocional',short:'Material promocional propio de Navidad Parque Field.',detail:'Autoriza el uso de la imagen en piezas destinadas a comunicar, promocionar o difundir futuras actividades, convocatorias o iniciativas propias de Navidad Parque Field. Es una autorización específica y separada de las demás finalidades.'},fullTitle:'CONSENTIMIENTO INFORMADO PARA LA CARGA, CAPTACIÓN Y USO DE IMAGEN Y VOZ – Evento “Fotos con Papá Noel”',fullText:'La autorización comprende, según corresponda, la captación o recepción, carga, almacenamiento, reproducción y eventual publicación de fotografías, videos o registros de voz vinculados con la actividad. Puede referirse a la propia imagen de una persona adulta o a la imagen de una persona menor de edad cuando quien presta el consentimiento cuenta con autoridad suficiente para hacerlo. La carga de una imagen no constituye por sí sola una autorización general para cualquier uso futuro.\n\nLas finalidades se mantienen separadas: registro y memoria del evento; difusión digital; difusión institucional; y difusión promocional. Una finalidad autorizada no implica autorización para las restantes.\n\nCuando aparece una persona menor de edad, quien consiente declara que la autorización responde a su interés superior, que se respetan su dignidad, privacidad, identidad, honor, reputación e imagen y que fue informado/a de acuerdo con su edad y madurez. Debe tenerse en cuenta su opinión y, si el menor manifiesta una oposición clara a la publicación o difusión, ese uso no debe autorizarse o debe revocarse para el futuro.\n\nLos datos se tratarán únicamente en la medida necesaria para gestionar la participación, acreditar el consentimiento, vincular la autorización con la imagen y aplicar las finalidades elegidas. No se pretende obtener una autorización ilimitada o general de derechos de imagen. No se utilizarán los datos o imágenes para finalidades diferentes de las seleccionadas ni se transferirán a terceros para sus propios fines comerciales o publicitarios.\n\nSe permiten ajustes técnicos razonables necesarios para publicar o conservar el material, como recorte, redimensionado, compresión o cambio de formato, siempre que no impliquen una alteración sustancial ni afecten la dignidad de la persona.\n\nEl consentimiento puede revocarse para usos futuros mediante el mecanismo que informe la organización. La revocación produce efectos hacia adelante y no afecta los tratamientos realizados lícitamente con anterioridad.\n\nLa constancia digital registra, como mínimo, la versión del consentimiento, las finalidades seleccionadas, la identidad declarada de quien consiente, la condición de adulto o menor, los datos del menor cuando corresponda, la fecha y hora del registro y un identificador único que permite vincular la autorización con la carga. También pueden registrarse determinados datos técnicos de auditoría.\n\nReferencias normativas informativas: Código Civil y Comercial de la Nación, artículos 51, 52 y 53; Convención sobre los Derechos del Niño; Ley 26.061 de Protección Integral de los Derechos de Niñas, Niños y Adolescentes; Ley 25.326 de Protección de los Datos Personales y su normativa reglamentaria. El texto debe ser revisado jurídicamente antes de la puesta en producción definitiva.'}};
function merge(a,b){if(!b||typeof b!=='object')return a;for(const k of Object.keys(b)){if(Array.isArray(b[k]))a[k]=b[k];else if(b[k]&&typeof b[k]==='object')a[k]=merge(a[k]||{},b[k]);else a[k]=b[k]}return a}function setDirty(){dirty=true;const s=$('#saveState');if(s)s.textContent='Cambios sin guardar'}function msg(t,error=false){const e=$('#pageMessage');if(e){e.className='message'+(error?' error':'');e.textContent=t;setTimeout(()=>{e.textContent='';e.className=''},3500)}}

async function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');await loadConfig();render()}async function loadConfig(){config=clone(defaults);try{const r=await fetch(SUPABASE_URL+'/rest/v1/npf_site_content?id=eq.1&select=data',{headers:headers()}),rows=await r.json();if(r.ok&&rows[0]?.data)config=merge(config,rows[0].data)}catch(e){console.error(e)}}

function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));viewTitle.textContent={general:'Portada',assets:'Imágenes',history:'Nuestra historia',events:'Eventos y horarios',songs:'Villancicos',consent:'Consentimiento informado',sections:'Secciones visibles',photos:'Fotos recibidas',consents:'Registros de consentimiento'}[view];({general:generalView,assets:assetsView,history:historyView,events:eventsView,songs:songsView,consent:consentView,sections:sectionsView,photos:photosView,consents:consentsView})[view]()}
function generalView(){const g=config.general,l=config.letters,u=config.upload;shell('Portada','Editá los textos principales, la fecha y el lugar.',`<section class="panel"><h2>Presentación principal</h2><div class="formgrid"><label class="field"><span>Nombre del proyecto</span><input id="siteName" value="${esc(g.siteName)}"></label><label class="field"><span>Texto superior</span><input id="eyebrow" value="${esc(g.eyebrow)}"></label><label class="field"><span>Título principal</span><input id="heroTitle" value="${esc(g.heroTitle)}"></label><label class="field"><span>Texto destacado</span><input id="heroHighlight" value="${esc(g.heroHighlight)}"></label><label class="field full"><span>Descripción</span><textarea id="heroText">${esc(g.heroText)}</textarea></label></div></section><section class="panel"><h2>Cuenta regresiva y ubicación principal</h2><div class="formgrid"><label class="field"><span>Fecha y hora</span><input id="eventDate" type="datetime-local" value="${esc(g.eventDate)}"></label><label class="field"><span>Lugar principal</span><input id="eventPlace" value="${esc(g.eventPlace)}"></label><label class="field full"><span>Texto de la cuenta regresiva</span><input id="countTitle" value="${esc(g.countTitle)}"></label></div></section><section class="panel"><h2>Cartas y carga</h2><div class="formgrid"><label class="field"><span>Título Cartas a Santa</span><input id="letterTitle" value="${esc(l.title)}"></label><label class="field"><span>Texto Cartas a Santa</span><textarea id="letterText">${esc(l.text)}</textarea></label><label class="field"><span>Título carga</span><input id="uploadTitle" value="${esc(u.title)}"></label><label class="field"><span>Texto carga</span><textarea id="uploadText">${esc(u.text)}</textarea></label></div></section>`)}
function assetsView(){const g=config.general;shell('Imágenes','Cambiá el logo y el banner de portada. También podés pegar una URL.',`<section class="panel"><h2>Logo</h2><div class="asset"><div class="assetpreview">${g.logoUrl?'<img src="'+esc(g.logoUrl)+'">':'Sin logo'}</div><div><input id="logoFile" type="file" accept="image/*"><button class="btn primary" onclick="uploadAsset('logo')">Subir logo</button><label class="field" style="margin-top:10px"><span>URL del logo</span><input id="logoUrl" value="${esc(g.logoUrl)}"></label></div></div></section><section class="panel"><h2>Banner principal</h2><div class="asset"><div class="assetpreview"><img src="${esc(g.bannerUrl||'banner-navidad-parque-field.png')}"></div><div><input id="bannerFile" type="file" accept="image/*"><button class="btn primary" onclick="uploadAsset('banner')">Subir banner</button><label class="field" style="margin-top:10px"><span>URL del banner</span><input id="bannerUrl" value="${esc(g.bannerUrl)}" placeholder="Si queda vacío usa el banner incluido en el sitio"></label><p style="color:var(--muted);line-height:1.5">El banner que dejé incorporado en esta versión es el que enviaste. Si no cargás otro, la página seguirá usando ese archivo.</p></div></div></section>`)}
async function uploadAsset(type){const input=$('#'+type+'File'),file=input.files[0];if(!file)return msg('Elegí una imagen primero',true);if(file.size>15*1024*1024)return msg('La imagen supera los 15 MB',true);const ext=file.name.split('.').pop().toLowerCase(),path=`site-assets/${type}-${Date.now()}.${ext}`;try{const r=await fetch(`${SUPABASE_URL}/storage/v1/object/npf-public/${path}`,{method:'POST',headers:{...headers(),'Content-Type':file.type,'x-upsert':'false'},body:file});if(!r.ok)throw new Error(await r.text());const url=`${SUPABASE_URL}/storage/v1/object/public/npf-public/${path}`;config.general[type+'Url']=url;setDirty();render();msg('Imagen subida. Presioná Guardar y publicar.')}catch(e){msg('No se pudo subir: '+e.message,true)}}
function historyView(){const h=config.history;shell('Nuestra historia','Editá los textos y el relato completo.',`<section class="panel"><div class="formgrid"><label class="field full"><span>Introducción 1</span><textarea id="historyIntro1">${esc(h.intro1)}</textarea></label><label class="field full"><span>Introducción 2</span><textarea id="historyIntro2">${esc(h.intro2)}</textarea></label><label class="field full"><span>Frase principal</span><input id="historyPhrase" value="${esc(h.phrase)}"></label><label class="field"><span>Objetivo niños</span><textarea id="childrenGoal">${esc(h.childrenGoal)}</textarea></label><label class="field"><span>Objetivo adultos</span><textarea id="adultGoal">${esc(h.adultGoal)}</textarea></label><label class="field full"><span>Historia completa</span><textarea id="fullStory" style="min-height:220px">${esc(h.fullStory)}</textarea></label></div></section>`)}
function eventsView(){shell('Eventos y horarios','Agregá, editá, eliminá y destacá actividades.',`<section class="panel"><div class="repeat">${config.events.map((e,i)=>`<div class="item"><div class="itemfields"><input data-event="${i}" data-key="day" value="${esc(e.day)}" placeholder="Día"><input data-event="${i}" data-key="month" value="${esc(e.month)}" placeholder="Mes"><input class="wide2" data-event="${i}" data-key="title" value="${esc(e.title)}" placeholder="Evento"><input data-event="${i}" data-key="time" value="${esc(e.time)}" placeholder="Hora"><input class="wide2" data-event="${i}" data-key="place" value="${esc(e.place)}" placeholder="Lugar"><label><input type="checkbox" data-event="${i}" data-key="featured" ${e.featured?'checked':''}> Destacado</label></div><button class="btn danger" onclick="removeEvent(${i})">Eliminar</button></div>`).join('')}</div><button class="btn secondary" style="margin-top:13px" onclick="addEvent()">Agregar evento</button></section>`)}function addEvent(){collect();config.events.push({id:Date.now(),day:'',month:'DIC',title:'Nuevo evento',time:'',place:'',featured:false});render();setDirty()}function removeEvent(i){config.events.splice(i,1);render();setDirty()}
function songsView(){shell('Villancicos','Editá nombres y links de audio o video.',`<section class="panel"><div class="repeat">${config.songs.map((s,i)=>`<div class="item"><div class="itemfields"><input class="wide2" data-song="${i}" data-key="title" value="${esc(s.title)}" placeholder="Nombre"><input class="wide2" data-song="${i}" data-key="url" value="${esc(s.url)}" placeholder="https:// enlace de audio o video"></div><button class="btn danger" onclick="removeSong(${i})">Eliminar</button></div>`).join('')}</div><button class="btn secondary" style="margin-top:13px" onclick="addSong()">Agregar villancico</button></section>`)}function addSong(){collect();config.songs.push({id:Date.now(),title:'Nuevo villancico',url:''});render();setDirty()}function removeSong(i){config.songs.splice(i,1);render();setDirty()}
function consentView(){const c=config.consent,ps=[['purposeEvent','A. Registro y memoria del evento'],['purposeDigital','B. Difusión digital'],['purposeInstitutional','C. Difusión institucional'],['purposePromotional','D. Difusión promocional']];shell('Consentimiento informado','Acá recuperamos toda la configuración: versión, textos, cuatro finalidades y el detalle que aparece en las ventanas emergentes.',`<section class="panel"><h2>Identificación del consentimiento</h2><div class="formgrid"><label class="field"><span>Versión</span><input id="consVersion" value="${esc(c.version)}"></label><label class="field"><span>Nombre del evento</span><input id="consEventName" value="${esc(c.eventName)}"></label><label class="field"><span>Lugar del evento</span><input id="consEventLocation" value="${esc(c.eventLocation)}"></label><label class="field"><span>Título completo</span><input id="fullTitle" value="${esc(c.fullTitle)}"></label></div></section><section class="panel"><h2>Pasos y textos visibles</h2><div class="formgrid"><label class="field"><span>Título paso 1</span><input id="step1Title" value="${esc(c.step1Title)}"></label><label class="field"><span>Texto paso 1</span><textarea id="step1Text">${esc(c.step1Text)}</textarea></label><label class="field"><span>Título paso 2</span><input id="step2Title" value="${esc(c.step2Title)}"></label><label class="field"><span>Texto paso 2</span><textarea id="step2Text">${esc(c.step2Text)}</textarea></label><label class="field"><span>Título información importante</span><input id="importantTitle" value="${esc(c.importantTitle)}"></label><label class="field"><span>Texto información importante</span><textarea id="importantText">${esc(c.importantText)}</textarea></label><label class="field"><span>Título menor</span><input id="minorTitle" value="${esc(c.minorTitle)}"></label><label class="field"><span>Texto de protección del menor</span><textarea id="minorBox">${esc(c.minorBox)}</textarea></label></div></section><section class="panel"><h2>Cuatro finalidades</h2><p style="color:var(--muted)">Cada una tiene su propio detalle emergente en la página pública.</p>${ps.map(([key,label])=>{const p=c[key];return `<div class="purpose-editor"><h3>${label}</h3><div class="grid"><label class="field"><span>Título</span><input data-purpose="${key}" data-key="title" value="${esc(p.title)}"></label><label class="field"><span>Texto corto</span><input data-purpose="${key}" data-key="short" value="${esc(p.short)}"></label><label class="field" style="grid-column:1/-1"><span>Detalle emergente</span><textarea data-purpose="${key}" data-key="detail">${esc(p.detail)}</textarea></label></div></div>`}).join('')}</section><section class="panel"><h2>Declaraciones y confirmación final</h2><div class="formgrid"><label class="field"><span>Texto declaración interés superior</span><textarea id="minorBestText">${esc(c.minorBestText)}</textarea></label><label class="field"><span>Texto declaración menor informado</span><textarea id="minorInformedText">${esc(c.minorInformedText)}</textarea></label><label class="field"><span>Título confirmación final</span><input id="finalTitle" value="${esc(c.finalTitle)}"></label><label class="field"><span>Confirmación: lectura</span><textarea id="finalReadText">${esc(c.finalReadText)}</textarea></label><label class="field"><span>Confirmación: autoridad</span><textarea id="finalAuthorityText">${esc(c.finalAuthorityText)}</textarea></label><label class="field"><span>Confirmación: finalidades</span><textarea id="finalPurposesText">${esc(c.finalPurposesText)}</textarea></label><label class="field full"><span>Confirmación: tratamiento</span><textarea id="finalTreatmentText">${esc(c.finalTreatmentText)}</textarea></label></div></section><section class="panel"><h2>Consentimiento completo</h2><label class="field full"><span>Texto legal completo de la ventana emergente</span><textarea id="fullText" style="min-height:380px">${esc(c.fullText)}</textarea></label></section>`)}
function sectionsView(){const labels={about:'Conocé más de nosotros',countdown:'Cuenta regresiva',songs:'Villancicos',letters:'Cartas a Santa',events:'Eventos',upload:'Carga de fotografías'};shell('Secciones visibles','Elegí qué contenidos aparecen en la página pública.',`<section class="panel"><div class="switches">${Object.entries(labels).map(([k,v])=>`<label class="switch"><input type="checkbox" data-section="${k}" ${config.sections[k]?'checked':''}><strong>${v}</strong></label>`).join('')}</div></section>`)}
function collect(){if(view==='general'){Object.assign(config.general,{siteName:siteName.value,eyebrow:eyebrow.value,heroTitle:heroTitle.value,heroHighlight:heroHighlight.value,heroText:heroText.value,eventDate:eventDate.value,countTitle:countTitle.value,eventPlace:eventPlace.value});Object.assign(config.letters,{title:letterTitle.value,text:letterText.value});Object.assign(config.upload,{title:uploadTitle.value,text:uploadText.value})}if(view==='assets'){config.general.logoUrl=logoUrl.value.trim();config.general.bannerUrl=bannerUrl.value.trim()}if(view==='history')Object.assign(config.history,{intro1:historyIntro1.value,intro2:historyIntro2.value,phrase:historyPhrase.value,childrenGoal:childrenGoal.value,adultGoal:adultGoal.value,fullStory:fullStory.value});if(view==='events')document.querySelectorAll('[data-event]').forEach(x=>config.events[+x.dataset.event][x.dataset.key]=x.type==='checkbox'?x.checked:x.value);if(view==='songs')document.querySelectorAll('[data-song]').forEach(x=>config.songs[+x.dataset.song][x.dataset.key]=x.value);if(view==='sections')document.querySelectorAll('[data-section]').forEach(x=>config.sections[x.dataset.section]=x.checked);if(view==='consent'){const c=config.consent;Object.assign(c,{version:consVersion.value,eventName:consEventName.value,eventLocation:consEventLocation.value,fullTitle:fullTitle.value,step1Title:step1Title.value,step1Text:step1Text.value,step2Title:step2Title.value,step2Text:step2Text.value,importantTitle:importantTitle.value,importantText:importantText.value,minorTitle:minorTitle.value,minorBox:minorBox.value,minorBestText:minorBestText.value,minorInformedText:minorInformedText.value,finalTitle:finalTitle.value,finalReadText:finalReadText.value,finalAuthorityText:finalAuthorityText.value,finalPurposesText:finalPurposesText.value,finalTreatmentText:finalTreatmentText.value,fullText:fullText.value});document.querySelectorAll('[data-purpose]').forEach(x=>c[x.dataset.purpose][x.dataset.key]=x.value)}}
async function signed(path){const p=path.split('/').map(encodeURIComponent).join('/'),r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/npf-files/${p}`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:'{"expiresIn":600}'}),d=await r.json();return SUPABASE_URL+'/storage/v1'+d.signedURL}
async function photosView(){shell('Fotos recibidas','Revisá las imágenes enviadas por las familias.',`<div class="stats"><article class="stat">Pendientes<b id="pcount">—</b></article><article class="stat">Aprobadas<b id="acount">—</b></article><article class="stat">Rechazadas<b id="rcount">—</b></article></div><div id="gallery" class="gallery"><div class="empty">Cargando imágenes…</div></div>`,false);try{const r=await fetch(SUPABASE_URL+'/rest/v1/family_uploads?select=*&order=created_at.desc',{headers:headers()}),rows=await r.json();pcount.textContent=rows.filter(x=>x.status==='pendiente').length;acount.textContent=rows.filter(x=>x.status==='aprobada').length;rcount.textContent=rows.filter(x=>x.status==='rechazada').length;const cards=await Promise.all(rows.filter(x=>x.status==='pendiente').map(async row=>{let url='';try{url=await signed(row.storage_path)}catch{}return `<article class="photo"><img src="${url}" alt="Imagen pendiente"><div class="photobody"><strong>${esc(row.original_name)}</strong><small>${new Date(row.created_at).toLocaleString('es-AR')}</small><div class="photoactions"><button class="btn green" onclick="approvePhoto('${row.id}',this)">Aprobar</button><button class="btn danger" onclick="rejectPhoto('${row.id}','${esc(row.storage_path)}',this)">Rechazar</button></div></div></article>`}));gallery.innerHTML=cards.join('')||'<div class="empty">No hay fotografías pendientes.</div>'}catch(e){gallery.innerHTML='<div class="empty">No se pudieron cargar las imágenes.</div>'}}
async function approvePhoto(id,b){b.disabled=true;try{const r=await fetch(SUPABASE_URL+'/functions/v1/approve-family-upload',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({id})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo aprobar');photosView()}catch(e){alert(e.message);b.disabled=false}}async function rejectPhoto(id,path,b){if(!confirm('¿Rechazar y eliminar definitivamente esta imagen?'))return;b.disabled=true;const p=path.split('/').map(encodeURIComponent).join('/');try{const d=await fetch(`${SUPABASE_URL}/storage/v1/object/npf-files/${p}`,{method:'DELETE',headers:headers()});if(!d.ok)throw new Error('No se pudo eliminar el archivo');const u=await fetch(`${SUPABASE_URL}/rest/v1/family_uploads?id=eq.${id}`,{method:'PATCH',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({status:'rechazada',rejected_at:new Date().toISOString()})});if(!u.ok)throw new Error('No se pudo actualizar el registro');photosView()}catch(e){alert(e.message);b.disabled=false}}
async function consentsView(){shell('Registros de consentimiento','Consultá cada consentimiento y abrí su detalle completo.',`<div class="searchbar"><input id="consentSearch" placeholder="Buscar por código, nombre, DNI o menor"><button class="btn secondary" onclick="loadConsents()">Actualizar</button></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Código</th><th>Persona</th><th>Menor</th><th>Finalidades</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody id="consentRows"><tr><td colspan="7">Cargando…</td></tr></tbody></table></div>`,false);await loadConsents()}
let consentRows=[];async function loadConsents(){try{const r=await fetch(SUPABASE_URL+'/rest/v1/family_consents?select=*&order=created_at.desc',{headers:headers()}),rows=await r.json();if(!r.ok)throw new Error(rows?.message||'No se pudieron cargar');consentRows=rows;renderConsentRows()}catch(e){$('#consentRows').innerHTML='<tr><td colspan="7">No se pudieron cargar los registros. Revisá las políticas RLS de administración.</td></tr>'}}function renderConsentRows(){const q=($('#consentSearch')?.value||'').toLowerCase();const rows=consentRows.filter(x=>[x.consent_code,x.consent_name,x.consent_dni,x.minor_name].some(v=>String(v||'').toLowerCase().includes(q)));$('#consentRows').innerHTML=rows.map(x=>{const p=[['Registro',x.purpose_event_record],['Digital',x.purpose_digital],['Institucional',x.purpose_institutional],['Promocional',x.purpose_promotional]].filter(a=>a[1]).map(a=>a[0]).join(', ')||'Ninguna';return `<tr><td><strong>${esc(x.consent_code||x.id)}</strong></td><td>${esc(x.consent_name)}<br><small>${esc(x.consent_dni)}</small></td><td>${esc(x.minor_name||'—')}</td><td>${esc(p)}</td><td>${new Date(x.created_at).toLocaleString('es-AR')}</td><td><span class="pill ${x.status==='revocado'?'off':''}">${esc(x.status||'vigente')}</span></td><td><button class="btn secondary" onclick="showConsentDetail('${x.id}')">Ver detalle</button></td></tr>`}).join('')||'<tr><td colspan="7">No hay registros.</td></tr>';$('consentSearch')?.addEventListener('input',renderConsentRows,{once:true})}
function showConsentDetail(id){const x=consentRows.find(r=>r.id===id);if(!x)return;const purposes=[['Registro y memoria',x.purpose_event_record],['Difusión digital',x.purpose_digital],['Difusión institucional',x.purpose_institutional],['Difusión promocional',x.purpose_promotional]];$('#detailTitle').textContent='Consentimiento '+(x.consent_code||x.id);$('#detailBody').innerHTML=`<div class="detailgrid"><div class="detailbox"><b>Persona</b><p>${esc(x.consent_name)} · DNI ${esc(x.consent_dni)}</p></div><div class="detailbox"><b>Tipo</b><p>${esc(x.person_type)}</p></div><div class="detailbox"><b>Menor</b><p>${esc(x.minor_name||'No corresponde')}</p></div><div class="detailbox"><b>Relación</b><p>${esc(x.minor_relation||'No corresponde')}</p></div><div class="detailbox"><b>Evento</b><p>${esc(x.event_name)} · ${esc(x.event_location)}</p></div><div class="detailbox"><b>Versión / fecha</b><p>${esc(x.consent_version)} · ${new Date(x.created_at).toLocaleString('es-AR')}</p></div></div><h3 style="margin-top:20px">Finalidades</h3><ul>${purposes.map(p=>'<li><strong>'+esc(p[0])+'</strong>: '+(p[1]?'AUTORIZO':'NO AUTORIZO')+'</li>').join('')}</ul><h3>Declaraciones</h3><ul><li>Interés superior del menor: ${x.minor_best_interest?'Sí':'No corresponde / No'}</li><li>Menor informado: ${x.minor_informed?'Sí':'No corresponde / No'}</li><li>Lectura: ${x.final_read?'Sí':'No'}</li><li>Autoridad y veracidad: ${x.final_authority?'Sí':'No'}</li><li>Finalidades individuales: ${x.final_purposes?'Sí':'No'}</li><li>Tratamiento según finalidades: ${x.final_treatment?'Sí':'No'}</li></ul><h3>Auditoría</h3><pre style="white-space:pre-wrap;background:#f6f8f7;padding:12px;border-radius:10px;font-size:11px">${esc(JSON.stringify(x.audit||{},null,2))}</pre>`;$('#detailModal').classList.add('open')}
function closeDetail(){$('#detailModal').classList.remove('open')}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('Hay cambios sin guardar. ¿Cambiar de sección igualmente?'))return;collect();view=b.dataset.view;dirty=false;render()});content.addEventListener('input',setDirty);verify();
</script></body></html>
