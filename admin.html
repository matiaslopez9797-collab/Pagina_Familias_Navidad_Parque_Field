<section id="loginView" class="loginpage"><form id="loginForm" class="login"><span class="mark">NPF</span><h1>Administración</h1><p>Ingresá para actualizar el contenido de la página familiar.</p><label class="field"><span>Correo</span><input id="email" value="navidadparquefield@gmail.com" readonly></label><label class="field" style="margin:16px 0"><span>Contraseña</span><input id="password" type="password" required></label><div id="loginMessage"></div><button id="loginBtn" class="btn primary">Ingresar</button></form></section>

<script>
const content=document.getElementById('content');
const SUPABASE_URL='https://rlzmyuizjdvbvcyeruyq.supabase.co',SUPABASE_KEY='sb_publishable_F5l_0eQPnfZxUHecqyg2IA_C4HA--QX',ADMIN='navidadparquefield@gmail.com';let token=localStorage.getItem('npf_cms_token')||'',view='general',config=null,dirty=false;
const defaults={general:{siteName:'Navidad Parque Field',eyebrow:'Una Navidad hecha entre todos',heroTitle:'La magia vuelve a',heroHighlight:'Parque Field',heroText:'Compartí tus dibujos, cartas y recuerdos. Descubrí las actividades que estamos preparando para toda la familia.',logoUrl:'',bannerUrl:'',eventDate:'2026-12-20T18:00',countTitle:'Nos encontramos el 20 de diciembre',eventPlace:'Plaza del barrio'},history:{intro1:'Navidad Parque Field nace del encuentro de dos herencias: la costumbre familiar de armar pesebres para compartir con la comunidad y el recuerdo vivo de nuestra Nona, Tita Bolognesi.',intro2:'Con su guitarra y su bombo, la Nona recorría el flamante vecindario acompañada por niños y jóvenes, llenando sus calles de villancicos.',phrase:'Para que la gente vuelva a creer en la Navidad.',childrenGoal:'Encender el asombro y la ilusión, regalándoles recuerdos imborrables.',adultGoal:'Romper con la rutina y volver a disfrutar como cuando eran chicos.',fullStory:'En 2014 armamos nuestro primer pesebre familiar en Parque Field. En 2023 llegó el Buzón de Papá Noel y en 2025 Papá Noel salió a la vereda, visitó instituciones y protagonizó su Caravana.'},events:[{id:1,day:'20',month:'DIC',title:'Navidad Parque Field',time:'18:00',place:'Plaza del barrio',featured:true},{id:2,day:'12',month:'DIC',title:'Taller de adornos',time:'17:30',place:'Espacio comunitario',featured:false},{id:3,day:'16',month:'DIC',title:'Ensayo de villancicos',time:'18:30',place:'Plaza del barrio',featured:false}],songs:[{id:1,title:'Noche de paz',url:''},{id:2,title:'Campana sobre campana',url:''},{id:3,title:'Los peces en el río',url:''}],letters:{title:'Escribile una carta a Santa',text:'Contale qué fue lo más lindo de tu año y qué deseo tenés para tu comunidad.'},upload:{title:'Subí tu creación en 3 pasos',text:'Puede ser una foto de tu carta, dibujo, adorno o momento navideño. Un adulto debe acompañarte.'},sections:{about:true,countdown:true,songs:true,letters:true,events:true,upload:true}};
const $=s=>document.querySelector(s),headers=()=>({apikey:SUPABASE_KEY,Authorization:'Bearer '+token});function clone(x){return JSON.parse(JSON.stringify(x))}function merge(a,b){if(!b||typeof b!=='object')return a;for(const k of Object.keys(b)){if(Array.isArray(b[k]))a[k]=b[k];else if(b[k]&&typeof b[k]==='object')a[k]=merge(a[k]||{},b[k]);else a[k]=b[k]}return a}function esc(v=''){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function setDirty(){dirty=true;const s=$('#saveState');if(s)s.textContent='Cambios sin guardar'}function msg(text,error=false){const e=$('#pageMessage');if(e){e.className='message'+(error?' error':'');e.textContent=text;setTimeout(()=>{if(e.textContent===text)e.textContent='';e.className=''},3500)}}
async function verify(){if(!token)return;const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:headers()});if(!r.ok)return logoutNow();const u=await r.json();if(u.email!==ADMIN)return logoutNow();showApp()}
loginForm.onsubmit=async e=>{e.preventDefault();loginBtn.disabled=true;loginBtn.textContent='Ingresando…';try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok)throw new Error('Correo o contraseña incorrectos');token=d.access_token;localStorage.setItem('npf_cms_token',token);password.value='';showApp()}catch(e){loginMessage.className='message error';loginMessage.textContent=e.message}finally{loginBtn.disabled=false;loginBtn.textContent='Ingresar'}};function logoutNow(){localStorage.removeItem('npf_cms_token');token='';appView.classList.add('hidden');loginView.classList.remove('hidden')}logout.onclick=logoutNow;async function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');await loadConfig();render()}
async function loadConfig(){config=clone(defaults);try{const r=await fetch(SUPABASE_URL+'/rest/v1/npf_site_content?id=eq.1&select=data',{headers:headers()}),rows=await r.json();if(r.ok&&rows[0]?.data&&Object.keys(rows[0].data).length)config=merge(config,rows[0].data)}catch(e){console.error(e)}}
async function saveConfig(){collect();const b=$('#saveBtn');b.disabled=true;b.textContent='Guardando…';try{const r=await fetch(SUPABASE_URL+'/rest/v1/npf_site_content?id=eq.1',{method:'PATCH',headers:{...headers(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({data:config,updated_at:new Date().toISOString(),updated_by:ADMIN})});if(!r.ok)throw new Error(await r.text());dirty=false;$('#saveState').textContent='Página actualizada';msg('Cambios publicados correctamente')}catch(e){msg('No se pudo guardar: '+e.message,true)}finally{b.disabled=false;b.textContent='Guardar y publicar'}}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));viewTitle.textContent={general:'Portada',assets:'Imágenes',history:'Nuestra historia',events:'Eventos y horarios',songs:'Villancicos',sections:'Secciones visibles',photos:'Fotos recibidas'}[view];({general:generalView,assets:assetsView,history:historyView,events:eventsView,songs:songsView,sections:sectionsView,photos:photosView})[view]()}
function shell(title,sub,body,save=true){content.innerHTML=`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div></div><div id="pageMessage"></div>${body}${save?'<div class="savebar"><span id="saveState">Todos los cambios se publican en la página familiar.</span><button id="saveBtn" class="btn green" onclick="saveConfig()">Guardar y publicar</button></div>':''}`}
function generalView(){const g=config.general,l=config.letters,u=config.upload;shell('Portada','Configurá los textos principales, la fecha y el lugar.',`<section class="panel"><h2>Presentación principal</h2><div class="formgrid"><label class="field"><span>Nombre del proyecto</span><input id="siteName" value="${esc(g.siteName)}"></label><label class="field"><span>Texto superior</span><input id="eyebrow" value="${esc(g.eyebrow)}"></label><label class="field"><span>Título principal</span><input id="heroTitle" value="${esc(g.heroTitle)}"></label><label class="field"><span>Texto destacado</span><input id="heroHighlight" value="${esc(g.heroHighlight)}"></label><label class="field full"><span>Descripción</span><textarea id="heroText">${esc(g.heroText)}</textarea></label></div></section><section class="panel"><h2>Fecha y lugar</h2><div class="formgrid"><label class="field"><span>Fecha y hora de la cuenta regresiva</span><input id="eventDate" type="datetime-local" value="${esc(g.eventDate)}"></label><label class="field"><span>Lugar principal</span><input id="eventPlace" value="${esc(g.eventPlace)}"></label><label class="field full"><span>Texto de la cuenta regresiva</span><input id="countTitle" value="${esc(g.countTitle)}"></label></div></section><section class="panel"><h2>Cartas y formulario</h2><div class="formgrid"><label class="field"><span>Título Cartas a Santa</span><input id="letterTitle" value="${esc(l.title)}"></label><label class="field"><span>Texto Cartas a Santa</span><textarea id="letterText">${esc(l.text)}</textarea></label><label class="field"><span>Título carga de fotos</span><input id="uploadTitle" value="${esc(u.title)}"></label><label class="field"><span>Texto carga de fotos</span><textarea id="uploadText">${esc(u.text)}</textarea></label></div></section>`)}
function assetsView(){const g=config.general;shell('Imágenes','Subí el logo y el banner principal. Se guardan en npf-public.',`<section class="panel"><h2>Logo</h2><div class="asset"><div id="logoPreview" class="assetpreview">${g.logoUrl?`<img src="${esc(g.logoUrl)}">`:'Sin logo'}</div><div><input id="logoFile" type="file" accept="image/*"><button class="btn primary" onclick="uploadAsset('logo')">Subir logo</button><p>Recomendado: PNG o WEBP con fondo transparente.</p></div></div></section><section class="panel"><h2>Banner o imagen de portada</h2><div class="asset"><div id="bannerPreview" class="assetpreview">${g.bannerUrl?`<img src="${esc(g.bannerUrl)}">`:'Sin banner'}</div><div><input id="bannerFile" type="file" accept="image/*"><button class="btn primary" onclick="uploadAsset('banner')">Subir banner</button><p>Recomendado: imagen horizontal de al menos 1600 × 900 px.</p></div></div></section>`)}
async function uploadAsset(type){const input=$('#'+type+'File'),file=input.files[0];if(!file)return msg('Elegí una imagen primero',true);if(file.size>15*1024*1024)return msg('La imagen supera los 15 MB',true);const ext=file.name.split('.').pop().toLowerCase(),path=`site-assets/${type}-${Date.now()}.${ext}`;try{const r=await fetch(`${SUPABASE_URL}/storage/v1/object/npf-public/${path}`,{method:'POST',headers:{...headers(),'Content-Type':file.type,'x-upsert':'false'},body:file});if(!r.ok)throw new Error(await r.text());const url=`${SUPABASE_URL}/storage/v1/object/public/npf-public/${path}`;config.general[type+'Url']=url;setDirty();render();msg('Imagen subida. Presioná Guardar y publicar.')}catch(e){msg('No se pudo subir: '+e.message,true)}}
function historyView(){const h=config.history;shell('Nuestra historia','Editá la presentación, la frase central y el relato completo.',`<section class="panel"><div class="formgrid"><label class="field full"><span>Introducción 1</span><textarea id="historyIntro1">${esc(h.intro1)}</textarea></label><label class="field full"><span>Introducción 2</span><textarea id="historyIntro2">${esc(h.intro2)}</textarea></label><label class="field full"><span>Frase principal</span><input id="historyPhrase" value="${esc(h.phrase)}"></label><label class="field"><span>Objetivo para los niños</span><textarea id="childrenGoal">${esc(h.childrenGoal)}</textarea></label><label class="field"><span>Objetivo para los adultos</span><textarea id="adultGoal">${esc(h.adultGoal)}</textarea></label><label class="field full"><span>Historia completa</span><textarea id="fullStory" style="min-height:220px">${esc(h.fullStory)}</textarea></label></div></section>`)}
function eventsView(){shell('Eventos y horarios','Agregá, editá y eliminá las actividades publicadas.',`<section class="panel"><div id="eventList" class="repeat">${config.events.map((e,i)=>`<div class="item"><div class="itemfields"><input data-event="${i}" data-key="day" value="${esc(e.day)}" placeholder="Día"><input data-event="${i}" data-key="month" value="${esc(e.month)}" placeholder="Mes"><input class="wide2" data-event="${i}" data-key="title" value="${esc(e.title)}" placeholder="Evento"><input data-event="${i}" data-key="time" value="${esc(e.time)}" placeholder="Hora"><input class="wide2" data-event="${i}" data-key="place" value="${esc(e.place)}" placeholder="Lugar"><label><input type="checkbox" data-event="${i}" data-key="featured" ${e.featured?'checked':''}> Destacado</label></div><button class="btn danger" onclick="removeEvent(${i})">Eliminar</button></div>`).join('')}</div><button class="btn secondary" style="margin-top:13px" onclick="addEvent()">＋ Agregar evento</button></section>`)}function addEvent(){collect();config.events.push({id:Date.now(),day:'',month:'DIC',title:'Nuevo evento',time:'',place:'',featured:false});render();setDirty()}function removeEvent(i){config.events.splice(i,1);render();setDirty()}
function songsView(){shell('Villancicos','Configurá el nombre y un enlace de audio o video.',`<section class="panel"><div class="repeat">${config.songs.map((s,i)=>`<div class="item"><div class="itemfields"><input class="wide2" data-song="${i}" data-key="title" value="${esc(s.title)}" placeholder="Nombre del villancico"><input class="wide2" data-song="${i}" data-key="url" value="${esc(s.url)}" placeholder="https:// enlace de audio o video"></div><button class="btn danger" onclick="removeSong(${i})">Eliminar</button></div>`).join('')}</div><button class="btn secondary" style="margin-top:13px" onclick="addSong()">＋ Agregar villancico</button></section>`)}function addSong(){collect();config.songs.push({id:Date.now(),title:'Nuevo villancico',url:''});render();setDirty()}function removeSong(i){config.songs.splice(i,1);render();setDirty()}
function sectionsView(){const labels={about:'Conocé más de nosotros',countdown:'Cuenta regresiva',songs:'Villancicos',letters:'Cartas a Santa',events:'Eventos',upload:'Carga de fotografías'};shell('Secciones visibles','Elegí qué contenidos aparecen en la página pública.',`<section class="panel"><div class="switches">${Object.entries(labels).map(([k,v])=>`<label class="switch"><input type="checkbox" data-section="${k}" ${config.sections[k]?'checked':''}><strong>${v}</strong></label>`).join('')}</div></section>`)}
function collect(){if(view==='general'){Object.assign(config.general,{siteName:siteName.value,eyebrow:eyebrow.value,heroTitle:heroTitle.value,heroHighlight:heroHighlight.value,heroText:heroText.value,eventDate:eventDate.value,countTitle:countTitle.value,eventPlace:eventPlace.value});Object.assign(config.letters,{title:letterTitle.value,text:letterText.value});Object.assign(config.upload,{title:uploadTitle.value,text:uploadText.value})}if(view==='history')Object.assign(config.history,{intro1:historyIntro1.value,intro2:historyIntro2.value,phrase:historyPhrase.value,childrenGoal:childrenGoal.value,adultGoal:adultGoal.value,fullStory:fullStory.value});if(view==='events')document.querySelectorAll('[data-event]').forEach(x=>config.events[+x.dataset.event][x.dataset.key]=x.type==='checkbox'?x.checked:x.value);if(view==='songs')document.querySelectorAll('[data-song]').forEach(x=>config.songs[+x.dataset.song][x.dataset.key]=x.value);if(view==='sections')document.querySelectorAll('[data-section]').forEach(x=>config.sections[x.dataset.section]=x.checked)}
async function photosView(){shell('Fotos recibidas','Revisá las imágenes enviadas por las familias.',`<div class="stats"><article class="stat">Pendientes<b id="pcount">—</b></article><article class="stat">Aprobadas<b id="acount">—</b></article><article class="stat">Rechazadas<b id="rcount">—</b></article></div><div id="gallery" class="gallery"><div class="empty">Cargando imágenes…</div></div>`,false);try{const r=await fetch(SUPABASE_URL+'/rest/v1/family_uploads?select=*&order=created_at.desc',{headers:headers()}),rows=await r.json();pcount.textContent=rows.filter(x=>x.status==='pendiente').length;acount.textContent=rows.filter(x=>x.status==='aprobada').length;rcount.textContent=rows.filter(x=>x.status==='rechazada').length;const pending=rows.filter(x=>x.status==='pendiente');if(!pending.length)return gallery.innerHTML='<div class="empty">No hay fotografías pendientes.</div>';const cards=await Promise.all(pending.map(async row=>{let url='';try{url=await signed(row.storage_path)}catch{}return `<article class="photo"><img src="${url}" alt="Imagen pendiente"><div class="photobody"><strong>${esc(row.original_name)}</strong><small>${new Date(row.created_at).toLocaleString('es-AR')}</small><div class="photoactions"><button class="btn green" onclick="approvePhoto('${row.id}',this)">Aprobar</button><button class="btn danger" onclick="rejectPhoto('${row.id}','${esc(row.storage_path)}',this)">Rechazar</button></div></div></article>`}));gallery.innerHTML=cards.join('')}catch(e){gallery.innerHTML='<div class="empty">No se pudieron cargar las imágenes.</div>'}}
async function signed(path){const p=path.split('/').map(encodeURIComponent).join('/'),r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/npf-files/${p}`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:'{"expiresIn":600}'}),d=await r.json();return SUPABASE_URL+'/storage/v1'+d.signedURL}async function approvePhoto(id,b){b.disabled=true;try{const r=await fetch(SUPABASE_URL+'/functions/v1/approve-family-upload',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({id})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo aprobar');photosView()}catch(e){alert(e.message);b.disabled=false}}async function rejectPhoto(id,path,b){if(!confirm('¿Rechazar y eliminar definitivamente esta imagen?'))return;b.disabled=true;const p=path.split('/').map(encodeURIComponent).join('/');try{const d=await fetch(`${SUPABASE_URL}/storage/v1/object/npf-files/${p}`,{method:'DELETE',headers:headers()});if(!d.ok)throw new Error('No se pudo eliminar el archivo');const u=await fetch(`${SUPABASE_URL}/rest/v1/family_uploads?id=eq.${id}`,{method:'PATCH',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({status:'rechazada',rejected_at:new Date().toISOString()})});if(!u.ok)throw new Error('No se pudo actualizar el registro');photosView()}catch(e){alert(e.message);b.disabled=false}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('Hay cambios sin guardar. ¿Cambiar de sección igualmente?'))return;collect();view=b.dataset.view;dirty=false;render()});content.addEventListener('input',setDirty);verify();
</script></body></html>
